name: UVMS CI
on:
  push:
    branches: [main, integration/uvms-clean]
  pull_request:
    branches: [main]
jobs:
  backend-check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: node --check server.js
      - run: node --check scripts/migrate.js
      - run: node --check scripts/create-admin.js
      - run: node --check scripts/seed-dev.js
  frontend-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
  docker-build:
    needs: [backend-check, frontend-build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t uvms-backend:ci ./backend
      - run: docker build -t uvms-frontend:ci ./frontend
